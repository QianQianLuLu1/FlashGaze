name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  extras:
    name: extras
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with safe extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cv-enhanced,dedup,vlm-multi,gui,exif,xlsx]"
          pip install "mcp>=1.2.0,<2.0.0"   # mcp 版本钉死
          pip install -r requirements-dev.txt   # 测试工具链（pytest/pytest-cov）；pytest 唯一来源，必装否则 pytest 步骤失败
          pip install -r requirements-extras.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
