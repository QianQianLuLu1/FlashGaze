name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_webkit:
        description: 'Run the optional WebKit E2E job (non-blocking)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # opencv-python-headless 的 wheel 不链接 libGL，无需 apt 安装系统库
      # （见 pyproject.toml [project] dependencies 注释）；windows/macOS runner 也无 apt。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 主矩阵加装 4 个轻量 extras，使纳入 fail_under=80 门禁的模块真实执行：
          # mcp（mcp_server，M-12）、gui（webui/app 组件测试，2026-09 扩围）、
          # exif（exif_writer）、heic（HEIC 解码——固件随仓库分发，但解码必须
          # pillow-heif，缺失时用例优雅跳过）。重依赖模块（xlsx/dedup/portrait）
          # 仍由 .coveragerc omit，交 extras job 硬门槛度量。
          pip install -e ".[mcp,gui,exif,heic]"
          pip install -r requirements-dev.txt

      # 覆盖率门槛（fail_under = 80）来自 .coveragerc：pytest-cov 在总覆盖率
      # 低于门槛时以非零码退出，本步骤即门禁；下方 coverage report 同样受
      # fail_under 约束，双重兜底。omit 掉的 3 个可选 extras 模块由 extras job
      # 以硬门槛（.coveragerc-extras fail_under=50 + 逐模块下限）度量。
      - name: Run tests with coverage
        run: >
          python -m pytest tests/ -v --tb=short
          --cov=flashgaze
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      # 只在一条矩阵腿上写摘要，避免 12 份重复表格
      - name: Write coverage to job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      # coverage-* 产物刻意只含 coverage.xml，因此「这条腿到底挂在哪」此前无从判断：
      # 2026-10-23 的 12 腿产物里 macos-py3.10 / windows-py3.10 有 6 行分支没被覆盖，
      # 却无法区分是用例失败、报错还是根本没跑。junit 单独成产物（不塞进 coverage-*），
      # 保持既有「下载 12 个 zip 比对覆盖率」的习惯不被破坏。范式与 extras-health.yml
      # 的 --junitxml 采集端一致。
      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

      # 把本腿的通过/失败/错误一眼可见地写进 job summary，并对每条失败发 ::error::
      # 注解（GitHub 会聚到 checks 摘要，无需下载产物）。
      - name: Summarize leg test outcome
        if: always()
        shell: bash
        env:
          LEG_LABEL: test (${{ matrix.os }}, py${{ matrix.python-version }})
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          label = os.environ.get("LEG_LABEL", "test")
          if not os.path.exists("junit.xml"):
              # 反例护栏：pytest 没跑到写 junit（job 超时被取消 / 启动即崩）时只提示。
              # 真正的门禁是 pytest 自身退出码，此处绝不因缺产物把腿判红。
              print("::notice::junit.xml 缺失，本腿无测试摘要（pytest 可能在写出前就终止）")
              raise SystemExit(0)
          try:
              root = ET.parse("junit.xml").getroot()
          except ET.ParseError as exc:
              print(f"::notice::junit.xml 解析失败，跳过本腿摘要: {exc}")
              raise SystemExit(0)

          tot = {
              k: sum(int(s.get(k, 0) or 0) for s in root.iter("testsuite"))
              for k in ("tests", "failures", "errors", "skipped")
          }
          bad = []
          for tc in root.iter("testcase"):
              node, kind = tc.find("failure"), "FAILED"
              if node is None:
                  node, kind = tc.find("error"), "ERROR"
              if node is None:
                  continue
              head = (node.get("message") or "").strip().splitlines()
              ref = f"{tc.get('classname', '')}::{tc.get('name', '')}"
              # GitHub 的 ::error:: 用 % 做转义（覆盖率失败消息里就有 "80.0%"），
              # 不转义会让注解文本被截断/乱码；换行已按首行切掉。
              first = (head[0] if head else "").replace("%", "%25")
              bad.append(f"{kind} {ref}" + (f" — {first}" if first else ""))

          for line in bad[:50]:
              print(f"::error::{line}")
          if len(bad) > 50:
              print(f"::error::另有 {len(bad) - 50} 条未逐条列出，全量见 junit 产物")

          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as f:
                  f.write(
                      f"**{label}**: {tot['tests']} tests, {tot['failures']} failed, "
                      f"{tot['errors']} error, {tot['skipped']} skipped\n"
                  )
                  if bad:
                      f.write("\n".join(f"- {b}" for b in bad[:50]) + "\n")
          print(f"[{label}] tests={tot['tests']} failed={tot['failures']} "
                f"error={tot['errors']} skipped={tot['skipped']}")
          PY

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # M-17：裸跑 pytest 默认口径校验——空参收集不得出现 e2e/benchmarks 的
      # 测试节点 ID（含 "::" 形态，兼容无 e2e 依赖时 importorskip 跳过的输出），
      # 防止 pyproject addopts/testpaths 默认过滤被悄悄回退（collect-only 秒级）。
      - name: Bare pytest default gate (collect-only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pytest --collect-only -q > /tmp/bare-collect.txt
          ! grep -q "tests/e2e/.*::" /tmp/bare-collect.txt
          ! grep -q "benchmarks/.*::" /tmp/bare-collect.txt

  # ── 静态类型检查（mypy）─────────────────────────────────────────
  # 与 test 并行、阻塞主流程。目标版本语义由 pyproject [tool.mypy] 的
  # python_version 固定，单腿即可，无需进测试矩阵；本地等价命令：python -m mypy。
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      # 只装基础依赖：可选 extras（gradio/mcp/piexif 等）与 e2e 专属依赖
      # （playwright，仅 requirements-e2e.txt）由 pyproject 的 mypy overrides
      # 以 ignore_missing_imports 处理；@mcp.tool() 在 Any 下的 untyped-decorator
      # 由 mcp_server 专属 override 放行。保证本地最小环境与 CI 同一结果
      # （检查范围由配置 files=["flashgaze"] 提供）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: python -m mypy

  # ── 代码规范检查（ruff：lint + 格式化）──────────────────────────
  # 与 test/typecheck 并行、阻塞主流程。纯静态分析无需安装项目依赖
  # （opencv 等），只装 lint 工具链；目标版本语义由 pyproject [tool.ruff]
  # 的 target-version 固定，单腿即可，无需进测试矩阵。
  # 本地等价命令：python -m ruff check . && python -m ruff format --check .
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install lint toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff check
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  # ── AGENTS.md 完整性检查（跨会话项目上下文守护）────────────────────
  # F3 fix：强制 AGENTS.md 存在且包含必要章节（1-9 节），作为 Qoder Agent
  # 每次会话开始时自动读取的跨会话项目上下文载体。与 lint/typecheck 并行、
  # 阻塞主流程。纯标准库检查，无需安装项目依赖。
  # 本地等价命令：python -m tools.check_agents_md
  agents-md-integrity:
    name: AGENTS.md integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      # 纯标准库脚本，无需安装任何依赖
      - name: Check AGENTS.md integrity
        run: python -m tools.check_agents_md

  # ── 可选模块严格模式开关（读取 sentinel）────────────────────────────
  # extras job 自 M-12 修复起默认即阻塞（Coverage gate (hard floors) 硬门槛）。
  # 当可选模块健康度劣化达到临界点时，extras-health.yml 定时任务会在仓库写入
  # .github/extras-strict.lock；本 job 检出后判断该标记是否存在，输出 strict=true
  # → 下方 extras job 的 strict 步骤把 5 模块总下限在 50% 基础上加严到 60
  # （治理 R1 告警线），强制开发者修复直至恢复达标（R5）。
  check-strict:
    name: extras strict-mode check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      strict: ${{ steps.detect.outputs.strict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Detect sentinel lock
        id: detect
        run: |
          if [ -f .github/extras-strict.lock ]; then
            echo "strict=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::检测到 .github/extras-strict.lock，extras 校验临时升级为阻塞合并"
          else
            echo "strict=false" >> "$GITHUB_OUTPUT"
          fi

  extras:
    name: extras (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [test, check-strict]
    runs-on: ${{ matrix.os }}
    # 阻塞 job（M-12 修复）：下方 Coverage gate (hard floors) 步骤必须能真实
    # 失败才能拦住可选模块覆盖率劣化。夜间 sentinel 锁
    # （.github/extras-strict.lock）保留为加严升级机制：锁存在时 strict 步骤
    # 把 5 模块总下限抬到 60（治理 R1 告警线），强制修复直至恢复达标。
    #
    # 40 分钟是按实测取的，不是拍的（原值 20 让 macOS 腿在 58% 进度处被 runner 杀掉，
    # CI run 40107357212；派生的 Coverage gate 步骤再报「无覆盖率数据」，看着像门禁失败
    # 其实是超时）：
    #   - ubuntu 全程 11m23s（install 6m07s + pytest 5m06s），20 分钟对它够；
    #   - 同一停点（前 628 条用例结果行）ubuntu 97s vs macOS 824s = **8.5 倍**，而默认
    #     矩阵的 ubuntu→macOS 只有 1.46 倍：extras 集合里的真进程池用例在 macOS 是
    #     spawn 启动 + 只有 3 核，单条 test_score_batch_is_deterministic_without_vlm
    #     就 145.6s，test_hybrid_scorer.py 合计 457s、test_cli_main.py 271s；
    #   - 据此 pytest ≈24.8 分钟 + setup/install 5m33s + 门禁与上传 ≈ 31 分钟 → 取 40 留余量。
    # 上面那条「≈31 分钟」外推**已被 CI run 40174423841 证伪**：抬到 40 后该腿的测试步独自
    # 跑到 2091s（job 全程 2428s）仍未结束就被杀掉，即单步 > 34 分钟。58% 停点根本非线性——
    # 后半程集中了真进程池用例，其成本是「池数 × worker 数 × worker 冷启动 import」，而
    # hybrid_scorer 曾在模块级导入 deduplicator / portrait_engine / vlm_client，使每个 spawn
    # worker 都重付一遍 imagededup / face_recognition / litellm 的 import（默认矩阵不装这三
    # 个，所以同一平台只慢 1.46 倍——差额就是这笔税，不是 macOS 本身慢）。
    # 修的是那个乘法：改为按需导入，见 flashgaze/core/hybrid_scorer.py 的 TYPE_CHECKING 块
    # 与回归凭证 tests/test_worker_import_budget.py。**预算与上方全部阈值一条都没改**——
    # 继续抬 timeout 只是花钱把根因买下来，不解决它；真跑超了再按 fixes.md 的退路处理。
    # 修复实测（连续两轮全绿：run 40183752144 与 40186485850）：macOS 测试步 380s / 375s、
    # job 全程 661s / 681s，对比修复前两轮「881s 未完」与「2091s 未完」双双被 runner 杀掉。
    # ubuntu 侧**没有可测变化**（修复前后同为 302~404s 区间）——这正符合机理：Linux 默认 fork，
    # worker 不重新导入本模块，那笔 import 税本来就只在 spawn 平台（macOS/Windows）存在。
    # 所以 macOS/ubuntu 由 ≥5.2 倍（2091s 未完对 404s 的下界比值）回到 ~1 倍量级，平台异常消失，
    # 佐证根因定位正确。真实需求因此只有 ~11 分钟：**40 现在是刻意留的余量天花板，不是实测需求**。
    # 下限与这三个 run 号（起点 40107357212 / 证伪 40174423841 / 实测 40183752144）由
    # tests/test_coverage_gate_contract.py 钉住，缺任何一个都让这个数字重新变成无出处的自选值。
    timeout-minutes: 40
    strategy:
      fail-fast: false        # 单腿失败不取消其他腿
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies (with safe extras)
        run: |
          python -m pip install --upgrade pip
          # 安装全部「安全」可选依赖以覆盖 5 个可选模块；portrait（face_recognition）
          # 依赖 dlib，安装较重；本 job 现为阻塞门禁（M-12），安装失败会阻塞合并。
          pip install -e ".[cv-enhanced,dedup,vlm-multi,gui,exif,xlsx,portrait]"
          pip install "mcp>=1.2.0,<2.0.0"   # mcp 版本钉死
          pip install -r requirements-dev.txt   # 测试工具链（pytest/pytest-cov）；pytest 唯一来源，必装否则 pytest 步骤失败

      # 度量 5 个可选模块（.coveragerc-extras source 限定其清单；--cov=flashgaze
      # 使数据含全包，供下方逐模块 --include 门禁使用）。可选模块测试自身的
      # 不稳定由本步级 continue-on-error 兜底不阻塞；覆盖率门禁由下方
      # hard floors 步骤无条件强制（M-12 修复）。
      - name: Run tests with coverage
        continue-on-error: true
        run: >
          python -m pytest tests/ -v --tb=short
          --cov=flashgaze
          --cov-config=.coveragerc-extras
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      # 覆盖率硬门禁（无条件执行、阻塞合并；M-12 修复）：第一行为 5 个可选
      # 模块的总下限（fail_under=50 来自 .coveragerc-extras），其余为逐模块
      # 下限（按 2026-09-06 实测基线 int(rate)-5 冻结，取值溯源见
      # docs/extras-governance.md §2.1），
      # 由 tests/test_coverage_gate_contract.py 锁定防退化。
      - name: Coverage gate (hard floors)
        if: always()
        run: |
          # 前置：区分「没有数据」与「数据不达标」。上方 pytest 步骤带 continue-on-error，
          # 收集阶段崩掉（如可选依赖在 import 期 quit() 打死 session）时根本不会写出 .coverage，
          # 四条 coverage report 只会打一句 "No data to report."——与「低于 floor」在日志里
          # 长得一模一样（CI run 39986414762 排查耗时 7 周即源于此，见 AGENTS.md §4.6 同源教训）。
          # 用 -s（存在且非空）而非 -f：空的数据文件同样是「无数据」。
          # 数值阈值一条都不改；也不改成第二条红源，真正的门禁仍是 pytest 退出码。
          [ -s .coverage ] || {
            echo "::error::无覆盖率数据（上一步 pytest 未正常完成，见其 INTERNALERROR），非覆盖率未达标"
            exit 1
          }
          echo "--- [1/4] 5 模块总下限（阈值来自 .coveragerc-extras fail_under=50）---"
          python -m coverage report --rcfile=.coveragerc-extras --include="flashgaze/mcp_server.py,flashgaze/webui/app.py,flashgaze/core/xlsx_exporter.py,flashgaze/core/deduplicator.py,flashgaze/core/portrait_engine.py"
          echo "--- [2/4] flashgaze/mcp_server.py 逐模块下限 fail-under=82 ---"
          python -m coverage report --rcfile=.coveragerc-extras --include="flashgaze/mcp_server.py" --fail-under=82
          echo "--- [3/4] flashgaze/webui/app.py 逐模块下限 fail-under=80 ---"
          python -m coverage report --rcfile=.coveragerc-extras --include="flashgaze/webui/app.py" --fail-under=80
          echo "--- [4/4] flashgaze/core/xlsx_exporter.py 逐模块下限 fail-under=95 ---"
          python -m coverage report --rcfile=.coveragerc-extras --include="flashgaze/core/xlsx_exporter.py" --fail-under=95

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-extras-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      # extras 腿此前没有 junit：上方 pytest 步骤带 continue-on-error，可选模块的用例失败
      # 会被完全吞掉，CI 界面上只剩「覆盖率门禁通过」这一句 —— CI run 40107357212 的 4 条
      # CLI 失败（face_recognition 探测期污染 stdout，见 pitfalls §3.11 订正）之所以能被发现，
      # 全靠旁路 extras-health 恰好带 --junitxml。产物名必须带 extras 前缀：extras 与 test 两
      # 个 job 的 matrix.os / python-version 完全同名，upload-artifact@v4 会在同一次 run 内
      # 因重名报错。
      # 诚实标注：job 被 timeout-minutes 杀掉时 junit 不会写出（pytest 未走到收尾），本产物
      # 只覆盖「用例失败 / 报错」两类，超时仍需看原始日志。
      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-extras-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # flag 名必须与 codecov.yml 的 flags: 声明逐字一致。此前写 extras-${{ matrix.os }}
          # 实投 extras-ubuntu-latest / extras-macos-latest，与声明的 extras-ubuntu /
          # extras-macos 永不相交 → 声明里的 carryforward/informational 全部落空，
          # 可选模块的滚动覆盖率从未真正聚合（2026-10-23 产物复核发现）。
          # 用查表而非字符串拼接：新增 extras 腿时必须在此登记，否则 tests/
          # test_coverage_gate_contract.py 的 flag 对齐用例直接判红。
          flags: ${{ fromJSON('{"ubuntu-latest":"extras-ubuntu","macos-latest":"extras-macos"}')[matrix.os] }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # 严格模式加严门禁（仅当 sentinel 锁存在，strict=true）：在上方无条件
      # hard floors 之上，把 5 个可选模块总下限抬到 60（治理 R1 告警线），
      # 强制开发者修复直至恢复达标（R5）。默认（strict=false）跳过。
      - name: Strict coverage gate (only when locked)
        if: needs.check-strict.outputs.strict == 'true'
        run: python -m coverage report --fail-under=60 --rcfile=.coveragerc-extras --include="flashgaze/mcp_server.py,flashgaze/webui/app.py,flashgaze/core/xlsx_exporter.py,flashgaze/core/deduplicator.py,flashgaze/core/portrait_engine.py"

  # ── 浏览器端到端（Playwright：Chromium + Firefox）──────────────
  # 阻塞主流程：WebUI 的离线评分流程确定性高（无 VLM 网络调用），适合作为
  # 门禁。组件级测试（tests/test_webui_components.py）已随 extras job 运行，
  # 本 job 专门跑浏览器级 tests/e2e；依赖 gui+xlsx extras。
  # 浏览器矩阵：chromium（默认/首条腿，行为与原配置完全一致）+ firefox（必选
  # 第二项），fail-fast=false 使两浏览器并行且任一失败均阻断合并。WebKit 不在此
  # 门禁内，见下方可选的 e2e-webkit job。
  # 本地等价命令（逐浏览器）：
  #   pip install -e ".[gui,xlsx]" -r requirements-dev.txt -r requirements-e2e.txt
  #   python -m playwright install <browser> --with-deps   # windows/macOS 去掉 --with-deps
  #   python -m pytest tests/e2e -m "e2e" -v --browser <browser>
  # （-m "e2e" 覆盖 pyproject addopts 的默认过滤 -m "not e2e"，见 M-17）
  e2e:
    name: e2e (playwright, ${{ matrix.browser }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,xlsx]"
          pip install -r requirements-dev.txt
          pip install -r requirements-e2e.txt

      - name: Install ${{ matrix.browser }} for Playwright
        run: python -m playwright install ${{ matrix.browser }} --with-deps

      - name: Run E2E tests
        run: python -m pytest tests/e2e -m "e2e" -v --tb=short --browser ${{ matrix.browser }}

  # ── 浏览器端到端（Playwright：WebKit，可选）────────────────────
  # 非门禁：仅当手动触发 workflow_dispatch 且勾选 run_webkit 时运行，
  # continue-on-error 保证即使失败也不阻塞合并；默认（push/PR）不触发。
  # 本地亦可手动验证：python -m playwright install webkit &&
  #   python -m pytest tests/e2e -m "e2e" -v --browser webkit
  e2e-webkit:
    name: e2e (playwright, webkit, optional)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_webkit
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,xlsx]"
          pip install -r requirements-dev.txt
          pip install -r requirements-e2e.txt

      - name: Install WebKit for Playwright
        run: python -m playwright install webkit --with-deps

      - name: Run E2E tests
        run: python -m pytest tests/e2e -m "e2e" -v --tb=short --browser webkit
