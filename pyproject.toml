[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashgaze"
version = "0.1.0"
description = "瞬选灵眸 - AI 辅助图片评分与筛选 CLI + MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FlashGaze Contributors" },
]
keywords = ["image", "scoring", "photography", "mcp", "cli", "cv", "vlm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pillow-heif>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/QianQianLuLu1/FlashGaze"
Repository = "https://github.com/QianQianLuLu1/FlashGaze"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
flashgaze = "flashgaze.cli.entry:main"

[tool.setuptools.packages.find]
include = ["flashgaze*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["cv2.*", "PIL.*", "mcp.*"]
ignore_missing_imports = true

# 初次引入 mypy，对类型注解尚未完善的模块按错误码放宽，避免阻塞 CI。
# 后续补齐类型注解后逐项移除。
[[tool.mypy.overrides]]
module = ["flashgaze.utils.config", "flashgaze.core.vlm_client"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["flashgaze.utils.image_io"]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=flashgaze --cov-report=term-missing --cov-fail-under=80"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with --skip-slow)",
]

[tool.coverage.run]
source = ["flashgaze"]
omit = ["flashgaze/__main__.py", "*/tests/*"]
