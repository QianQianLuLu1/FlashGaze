# FlashGaze 本地代码质量守护（pre-commit）
#
# 在 `git commit` 时自动运行 ruff（lint + 格式化检查）、mypy（静态类型检查）
# 与 AGENTS.md 完整性检查，行为与 CI 的 lint / typecheck / agents-md-integrity
# job 完全一致：
#   - python -m ruff check .
#   - python -m ruff format --check .
#   - python -m mypy
#   - python -m tools.check_agents_md（AGENTS.md 存在性 + 必要章节检查）
#
# 采用 repo: local，直接复用开发者已安装 requirements-dev.txt 的虚拟环境
# （ruff==0.16.10 / mypy==1.20.2 / types-requests==2.33.0.20261006，均钉死单版本），
# 因此规则与版本完全来自 pyproject.toml 的 [tool.ruff] / [tool.mypy]，无需在此重复声明，
# 也不会出现与 CI 的版本漂移。
#
# 注意：本处 mypy 只覆盖「当前机器平台」那一面。Windows 开发机上 win32 之外的类型错误
# 看不见，需另跑 `make typecheck-posix`（= python -m mypy --platform linux）；未挂成 hook
# 是为了不让每次提交多付一遍 mypy 时长，收口由 CI 的 typecheck job（ubuntu）负责。
#
# 安装（在仓库根，即 pyproject.toml 所在目录执行）：
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# 手动对全部文件运行（等价于 CI）：
#   pre-commit run --all-files

repos:
  # ── AGENTS.md 完整性检查（跨会话项目上下文守护）────────────────
  # F3 fix：强制 AGENTS.md 存在且包含必要章节（1-9 节），作为 Qoder Agent
  # 每次会话开始时自动读取的跨会话项目上下文导航入口。
  # 同时检查 docs/agent-context/ 作用域文档存在（architecture/pitfalls/fixes/release）。
  # 检查脚本：tools/check_agents_md.py
  # 本地等价命令：python -m tools.check_agents_md
  - repo: local
    hooks:
      - id: agents-md-exists
        name: AGENTS.md integrity check
        entry: python -m tools.check_agents_md
        language: system
        pass_filenames: false
        always_run: true
        files: ^AGENTS\.md$

  # ── ruff：lint 检查 ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: python -m ruff check .
        language: system
        pass_filenames: false   # 让 ruff 按 pyproject 的 extend-exclude 全量检查
        always_run: true
        types: [python]

  # ── ruff：格式化检查（与 CI 一致，只检查不自动修复）──────────────
      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

  # ── mypy：静态类型检查 ───────────────────────────────────────────
      - id: mypy
        name: mypy (type check)
        entry: python -m mypy
        language: system
        pass_filenames: false   # 由 [tool.mypy] files=["flashgaze","tests"] 决定范围
        always_run: true
        types: [python]
